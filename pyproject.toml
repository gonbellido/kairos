[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Multi-agent framework with experiential memory and behavioral impronta"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "qdrant-client>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "numpy>=1.26.0",
    "python-telegram-bot>=20.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ollama = ["langchain-ollama>=0.2.0"]
audio = ["openai-whisper>=20231117"]
voice = ["livekit-agents>=1.5", "livekit-plugins-cartesia", "livekit-plugins-silero",
         "livekit-plugins-deepgram", "livekit-plugins-openai"]
all = ["kairos[dev]", "kairos[ollama]", "kairos[audio]", "kairos[voice]"]

[tool.setuptools.packages.find]
include = ["kairos", "kairos.*"]
exclude = ["profiles*", "tests*", "scripts*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
