<!DOCTYPE html>
<html lang="{{ lang or 'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIROS — {{ t('login_title') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">
</head>
<body>
    <div class="full-center">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: var(--space-6);">
                <div style="font-size: 32px; margin-bottom: var(--space-3); color: var(--accent-teal);">◈</div>
                <h1>{{ t('login_heading') }}</h1>
                <p class="body" style="margin-top: var(--space-1);">{{ t('login_subtitle') }}</p>
            </div>

            {% if error %}
            <div class="alert alert-danger mb-4">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/client/login">
                <div class="form-group">
                    <label class="label" for="token">{{ t('ui.client_access_code', default='Tu código de acceso') }}</label>
                    <input type="text" id="token" name="token" class="input" required autofocus
                           placeholder="Ej: a1b2c3d4e5f6">
                </div>
                <button type="submit" class="btn btn-primary w-full" style="width: 100%;">
                    {{ t('login_button') }}
                </button>
            </form>

            <p class="text-sm" style="text-align: center; margin-top: var(--space-4);">
                {{ t('ui.client_login_no_code', default='¿No tienes código? Pídeselo a tu coach.') }}
            </p>
            <p style="text-align: center; margin-top: var(--space-2);">
                <a href="/" class="text-sm">← {{ t('ui.back_to_start', default='Volver al inicio') }}</a>
            </p>
        </div>
    </div>
</body>
</html>
