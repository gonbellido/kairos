# KAIROS — Server Block (sin SSL - primero ejecutar sin HTTPS para validar)
# Reemplazar DOMAIN con tu dominio real (ej: kairos.app)

# ── Root domain + Coach Backoffice ──
server {
    listen 80;
    server_name ether.care www.ether.care coach.* admin.*;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── API (api.DOMAIN) ──
server {
    listen 80;
    server_name api.*;

    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SSE streaming — sin buffering
    location /api/v1/chat/stream {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # LiveKit WebSocket signaling (voice agent)
    # Client SDK appends /rtc: wss://api.ether.care/livekit → /livekit/rtc
    # Trailing slash strips /livekit prefix → livekit receives /rtc
    location /livekit {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Telegram webhook — público, sin rate limit
    location /telegram/webhook {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── MinIO Console (admin) ──
server {
    listen 80;
    server_name storage.*;

    client_max_body_size 500M;

    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── MinIO API ──
server {
    listen 80;
    server_name s3.*;

    client_max_body_size 500M;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── WAHA Dashboard ──
server {
    listen 80;
    server_name waha.*;

    location / {
        proxy_pass http://waha:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Default Catch-all ──
server {
    listen 80 default_server;
    server_name _;
    # Retornar 502 Bad Gateway si el host no coincide con los subdominios esperados
    # Esto evita el loop infinito de redirecciones si coach.$host no está resuelto.
    return 502 "Host not recognized. Use coach.*, api.*, storage.* or s3.* subdomains.";
}
