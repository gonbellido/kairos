{% extends "base.html" %}
{% block content %}
<div class="full-center">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: var(--space-6);">
            <div style="font-size: 32px; margin-bottom: var(--space-3); color: var(--accent-teal);">⚡</div>
            <h1>KAIROS</h1>
            <p class="body" style="margin-top: var(--space-1);">Acceso coaches</p>
        </div>

        {% if error %}
        <div class="alert alert-danger mb-4">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" class="input" required autofocus
                       placeholder="coach@kairos.app">
            </div>
            <div class="form-group">
                <label class="label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="input" required
                       placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-full" style="width: 100%;">
                Ingresar
            </button>
        </form>

        <p class="text-sm" style="text-align: center; margin-top: var(--space-4);">
            Demo: <strong style="color: var(--text-secondary);">coach@kairos.app</strong> / <strong style="color: var(--text-secondary);">coach123</strong>
        </p>
    </div>
</div>
{% endblock %}
