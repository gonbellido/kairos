# KAIROS — Docker Compose Producción
# Despliegue en Ubuntu 22.04+ con Nginx reverse proxy

services:
  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks: [kairos_net]

  # ── App (FastAPI) ──
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATABASE_URL: postgresql+asyncpg://kairos:${POSTGRES_PASSWORD}@postgres:5432/kairos
      MINIO_HOST: minio
      MINIO_PORT: 9000
      KAIROS_ENV: production
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/tmp/kairos_uploads
    networks: [kairos_net]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ── Qdrant Vector DB ──
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      retries: 10
      start_period: 20s
    networks: [kairos_net]
    deploy:
      resources:
        limits:
          memory: 1G

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      retries: 10
      start_period: 10s
    networks: [kairos_net]
    deploy:
      resources:
        limits:
          memory: 512M

  # ── MinIO Object Storage ──
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks: [kairos_net]
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  kairos_net:
    driver: bridge

volumes:
  nginx_logs:
  app_uploads:
  qdrant_data:
  postgres_data:
  minio_data:
